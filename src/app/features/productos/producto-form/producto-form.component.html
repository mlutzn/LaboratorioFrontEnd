<div class="col-md-6">
  <h2 class="mb-4">{{ esEdicion ? 'Editar producto' : 'Nuevo producto' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input id="nombre" type="text" class="form-control" formControlName="nombre" />
    </div>

    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción</label>
      <input id="descripcion" type="text" class="form-control" formControlName="descripcion" />
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="precio" class="form-label">Precio</label>
        <input id="precio" type="number" step="0.01" min="0" class="form-control" formControlName="precio" />
      </div>
      <div class="col-md-6 mb-3">
        <label for="cantidad" class="form-label">Cantidad</label>
        <input id="cantidad" type="number" step="1" min="0" class="form-control" formControlName="cantidad" />
      </div>
    </div>

    <div class="mb-3">
      <label for="categoriaId" class="form-label">Categoría</label>
      <select id="categoriaId" class="form-select" formControlName="categoriaId">
        <option [ngValue]="0" disabled>Seleccione una categoría</option>
        @for (c of categorias; track c.id) {
          <option [ngValue]="c.id">{{ c.nombre }}</option>
        }
      </select>
    </div>

    @if (errorMessage) {
      <div class="alert alert-danger">{{ errorMessage }}</div>
    }

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
      {{ esEdicion ? 'Actualizar' : 'Guardar' }}
    </button>
    <a class="btn btn-secondary ms-2" routerLink="/productos">Cancelar</a>
  </form>
</div>
