<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Categorías</h2>
  @if (auth.isAdmin()) {
    <a class="btn btn-success" routerLink="/categorias/nueva">Nueva categoría</a>
  }
</div>

@if (errorMessage) {
  <div class="alert alert-danger">{{ errorMessage }}</div>
}

<table class="table table-striped table-hover align-middle">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Descripción</th>
      @if (auth.isAdmin()) {
        <th>Acciones</th>
      }
    </tr>
  </thead>
  <tbody>
    @for (c of categorias; track c.id) {
      <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.nombre }}</td>
        <td>{{ c.descripcion }}</td>
        @if (auth.isAdmin()) {
          <td class="text-nowrap">
            <a class="btn btn-sm btn-warning me-2" [routerLink]="['/categorias/editar', c.id]">Editar</a>
            <button type="button" class="btn btn-sm btn-danger" (click)="eliminar(c)">Eliminar</button>
          </td>
        }
      </tr>
    } @empty {
      <tr>
        <td colspan="4" class="text-center text-muted">No hay categorías</td>
      </tr>
    }
  </tbody>
</table>
