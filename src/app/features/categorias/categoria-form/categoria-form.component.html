<div class="col-md-6">
  <h2 class="mb-4">{{ esEdicion ? 'Editar categoría' : 'Nueva categoría' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input id="nombre" type="text" class="form-control" formControlName="nombre" />
    </div>

    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción</label>
      <input id="descripcion" type="text" class="form-control" formControlName="descripcion" />
    </div>

    @if (errorMessage) {
      <div class="alert alert-danger">{{ errorMessage }}</div>
    }

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
      {{ esEdicion ? 'Actualizar' : 'Guardar' }}
    </button>
    <a class="btn btn-secondary ms-2" routerLink="/categorias">Cancelar</a>
  </form>
</div>
