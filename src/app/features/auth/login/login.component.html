<div class="col-md-4 mx-auto mt-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="card-title text-center mb-4">Iniciar sesión</h2>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input id="username" type="text" class="form-control" formControlName="username" />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" class="form-control" formControlName="password" />
        </div>

        @if (errorMessage) {
          <div class="alert alert-danger">{{ errorMessage }}</div>
        }

        <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid">Ingresar</button>
      </form>
      <p class="text-center mt-3 mb-0">
  ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
</p>
    </div>
  </div>
</div>
